name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The generated VM assets depend only on what the generator reads: its sources, the guest
      # pages Netscape renders, the display picker, and this workflow's toolchain versions.
      - name: Restore VM assets
        id: vm-assets
        uses: actions/cache/restore@v4
        with:
          path: public/vm
          key: vm-assets-${{ hashFiles('tools/vm/**', 'guest-pages.js', 'guest-display.js', '.github/workflows/deploy.yml') }}

      - name: Set up Bun
        if: steps.vm-assets.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Set up Zig
        if: steps.vm-assets.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install mtools
        if: steps.vm-assets.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mtools

      - name: Restore VM inputs
        if: steps.vm-assets.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/lexoliu-vm/sources
            ~/.cache/lexoliu-vm/hda
          key: vm-inputs-${{ hashFiles('tools/vm/sources.json', 'tools/vm/hda.sha256') }}

      - name: Build VM assets
        if: steps.vm-assets.outputs.cache-hit != 'true'
        run: bun tools/vm/build.ts

      - name: Save VM assets
        if: steps.vm-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/vm
          key: ${{ steps.vm-assets.outputs.cache-primary-key }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=lexo
