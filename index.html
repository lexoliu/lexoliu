  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      color: #e0e0e0;
      font-family: "MS Sans Serif", "Tahoma", "Geneva", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      position: relative;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #008080;
    }

    /* Full-Viewport Responsive Monitor Container */
    #monitor-frame {
      position: relative;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      background: #008080;
      overflow: hidden;
    }

    /* v86 screen_container */
    #screen_container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #screen_container > div {
      white-space: pre;
      font: 14px monospace;
      line-height: 14px;
    }

    #screen_container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: none;
    }

    /* Power button overlay */
    #power-screen {
      position: fixed;
      inset: 0;
      z-index: 25;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }

    #power-screen[hidden] {
      display: none;
    }

    #power-button {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      position: relative;
      border: 2px solid #3a3a3a;
      border-radius: 50%;
      color: #8a8a8a;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* The button's border is the dim track while loading; the ring over it fills with the download. */
    #power-screen[data-state="ready"] #power-button {
      border-color: #e0e0e0;
      color: #e0e0e0;
    }

    #power-screen[data-state="pending"] #power-button {
      color: #fff;
    }

    #power-button:focus-visible {
      outline: 2px solid #e0e0e0;
      outline-offset: 4px;
    }

    #power-button .power-icon {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* Download progress: a ring over the button's border, from 12 o'clock, clockwise. */
    #power-ring {
      position: absolute;
      inset: -2px;
      width: 72px;
      height: 72px;
      fill: none;
      stroke: #e0e0e0;
      stroke-width: 2;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    #power-ring circle {
      stroke-dasharray: 100;
      stroke-dashoffset: calc(100 - var(--progress, 0));
    }

    @media (prefers-reduced-motion: no-preference) {
      #power-screen[data-state="pending"] .power-icon {
        animation: power-pulse 1.4s ease-in-out infinite;
      }
    }

    @keyframes power-pulse {
      50% { opacity: 0.45; }
    }

    /* "click it" doodle pointing at the power button; shown from the first frame until a press. */
    .power-hint {
      position: absolute;
      overflow: visible;
      pointer-events: none;
      opacity: 0;
      color: #e0e0e0;
    }

    .power-hint path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .power-hint text {
      font-family: "Nothing You Could Do", cursive;
      font-size: 46px;
      fill: currentColor;
    }

    /* Landscape: the doodle sits up-left, its arrow tip (the viewBox's bottom-right) at the button's edge. */
    .power-hint--landscape {
      right: calc(50% + 28px);
      bottom: calc(50% + 28px);
      --hint-w: min(clamp(200px, 24vw, 420px), calc(50vw - 44px), calc((50vh - 44px) * 1.5));
      width: var(--hint-w);
      aspect-ratio: 3 / 2;
    }

    /* Portrait: the doodle sits above, its arrow tip (the viewBox's bottom-centre) at the button's top. */
    .power-hint--portrait {
      display: none;
      left: 50%;
      bottom: calc(50% + 42px);
      transform: translateX(-50%);
      --hint-w: min(clamp(200px, 56vw, 360px), calc(100vw - 32px), calc((50vh - 58px) * 0.8));
      width: var(--hint-w);
      aspect-ratio: 4 / 5;
    }

    @media (orientation: portrait) {
      .power-hint--landscape {
        display: none;
      }

      .power-hint--portrait {
        display: block;
      }
    }

    #power-screen:not([data-state="pending"]) .power-hint {
      opacity: 1;
    }

    #power-screen[data-state="pending"] .power-hint {
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }

    @media (prefers-reduced-motion: no-preference) {
      #power-screen:not([data-state="pending"]) .power-hint text {
        animation: power-hint-fade 0.5s ease-out both;
      }

      /* A non-scaling stroke dashes in screen pixels, so each path's --k (its length over the
         viewBox width) times the rendered width is its on-screen length. The gap outlasts the
         path, so no dash (or its round cap) shows before the draw starts. */
      #power-screen:not([data-state="pending"]) .power-hint path {
        --dash: calc(var(--hint-w) * var(--k));
        stroke-dasharray: var(--dash) calc(var(--dash) * 2);
        animation: power-hint-draw 1.1s cubic-bezier(0.45, 0, 0.3, 1) 0.4s both;
      }

      #power-screen:not([data-state="pending"]) .power-hint .power-hint-head {
        animation-duration: 0.25s;
        animation-delay: 1.5s;
      }
    }

    @keyframes power-hint-fade {
      from { opacity: 0; }
    }

    @keyframes power-hint-draw {
      from { stroke-dashoffset: calc(var(--dash) * 1.05); }
      to { stroke-dashoffset: 0; }
    }

    /* Shown once the guest has powered itself off and the browser kept the tab open */
    #off-screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #000;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      text-align: center;
      font-size: 16px;
      cursor: pointer;
    }

    #off-screen[hidden] {
      display: none;
    }
