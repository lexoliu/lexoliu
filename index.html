<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexo Liu — Windows 95 + Netscape Navigator 3.0 (lexo.cool)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      color: #e0e0e0;
      font-family: "MS Sans Serif", "Tahoma", "Geneva", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #008080;
    }

    /* Full-Viewport Responsive Monitor Container */
    #monitor-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #008080;
      overflow: hidden;
    }

    /* v86 screen_container */
    #screen_container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }

    #screen_container > div {
      white-space: pre;
      font: 14px monospace;
      line-height: 14px;
    }

    #screen_container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: none;
    }

    /* Power button overlay */
    #power-screen {
      position: fixed;
      inset: 0;
      z-index: 25;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }

    #power-screen[hidden] {
      display: none;
    }

    #power-button {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 2px solid #8a8a8a;
      border-radius: 50%;
      color: #8a8a8a;
      cursor: not-allowed;
      -webkit-tap-highlight-color: transparent;
    }

    #power-button:not(:disabled) {
      border-color: #e0e0e0;
      color: #e0e0e0;
      cursor: pointer;
    }

    #power-button:focus-visible {
      outline: 2px solid #e0e0e0;
      outline-offset: 4px;
    }

    #power-button svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    #power-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2px;
      width: 0;
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div id="app">

      <div id="power-screen">

        </button>

      </div>

      <!-- v86 Screen Container -->
      <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
        <canvas style="display: none"></canvas>

  <script src="/public/vm/libv86.js"></script>

</TABLE>`

      ),

      "/about.html": wrapHtml32(
        "Lexo Liu - About & Philosophy",
        "About Lexo Liu - Notes from Cyberspace",
        `<FONT SIZE="+1"><B>Background &amp; Philosophy</B></FONT>

<HR SIZE="1">
<B>Why a Windows 95 Virtual Machine?</B>

<LI><B>Real x86 Emulation:</B> This isn't a CSS theme. You are interacting with a real 32-bit Windows 95 OSR2 operating system running inside WebAssembly (<TT>v86</TT>).
<LI><B>Netscape Navigator 3.0 (1996):</B> Every page you view here is rendered by the authentic 1996 Netscape layout engine over a virtual NE2000 Ethernet card.
<LI><B>Host-Bridged Networking:</B> HTTP packets leaving Windows 95 are intercepted in browser JavaScript via <TT>FetchNetworkAdapter</TT> and served dynamically.

      ),

      "/photos.html": wrapHtml32(
        "Lexo Liu - Photo Album",
        "Lexo's Retro Cyberspace Photo Album",
        `<FONT SIZE="+1"><B>Photo Categories</B></FONT>

    // =========================================================================
    // 2. Initialize v86 Windows 95 Virtual Machine with Snapshot Restore
    // =========================================================================
    const powerScreen = document.getElementById("power-screen");
    const powerButton = document.getElementById("power-button");
    const powerProgress = document.getElementById("power-progress");

    // The guest display as the VM generator built it (tools/vm/display.ts): its VRAM size,
    // the mode in the saved state, and the modes the guest can switch to.
    const guestDisplay = await fetch("/public/vm/modes.json").then(async (res) => {
      if (!res.ok) throw new Error(`modes.json: HTTP ${res.status}`);
      return res.json();
    });

    const emulator = new V86({
      wasm_path: "/public/vm/v86.wasm",
      memory_size: 64 * 1024 * 1024,
      vga_memory_size: guestDisplay.vgaMemorySize,
      screen_container: document.getElementById("screen_container"),
      bios: { url: "/public/vm/seabios.bin" },
      vga_bios: { url: "/public/vm/vgabios.bin" },
      hda: {
        url: "/public/vm/hda/.img",
        size: 471859200,
        async: true,
        fixed_chunk_size: 256 * 1024,
        use_parts: true,
      },
      hdb: {
        url: "/public/vm/hdb.img?v=4",
        size: 8257536,
        async: false,
      },
      initial_state: {
        url: "/public/vm/win95-netscape.state.bin.zst?v=4",
      },
      disable_mouse: true,
      network_relay_url: "fetch",
      // The guest's NE2000 driver keeps the MAC from the saved state; without this,
      // v86 randomises the card's MAC on load and drops every frame sent to the guest.
      preserve_mac_from_state_image: true,
      autostart: false,
    });

    window.emulator = emulator;

    // Guest HTTP from Netscape arrives through the network adapter's fetch hook,
    // which v86 creates asynchronously, just before it announces "emulator-loaded".
    emulator.add_listener("emulator-loaded", () => {
      emulator.network_adapter.fetch = guestHttpFetch;
    });

    async function guestHttpFetch(input) {
      const parsed = new URL(typeof input === "string" ? input : input.url);
      const host = parsed.hostname.toLowerCase();
      if (host === "lexo.cool" || host === "www.lexo.cool") {
        const pathKey = parsed.pathname === "" || parsed.pathname === "/index.html" ? "/" : parsed.pathname;
        const html = PAGES[pathKey];
        const found = html !== undefined;
        const bytes = new TextEncoder().encode(
          found ? html : wrapHtml32("404 Not Found", "404 Not Found", `<P>No page at <TT>${pathKey}</TT>. <A HREF="http://lexo.cool/">Return home</A>.`)
        );
        return new Response(bytes, {
          status: found ? 200 : 404,
          statusText: found ? "OK" : "Not Found",
          headers: {
            "Content-Type": "text/html",
            "Content-Length": String(bytes.byteLength),
          },
        });
      }

      // Any other host: open it in the visitor's browser and keep Netscape on its page.
      const externalUrl = `https://${host}${parsed.pathname}${parsed.search}`;
      // The "noopener" feature makes window.open return null even on success, so
      // the refusal check needs the handle; the opener link is cut by hand.
      const opened = window.open(externalUrl, "_blank");
      if (opened) {
        opened.opener = null;
      } else {
        window.location.assign(externalUrl);
      }
      return new Response(null, { status: 204, statusText: "No Content" });
    }


    // =========================================================================
    // 2b. Custom Pointer & Touch Input Bridge (Fixes v86 outside-click & PS/2 bugs)
    // =========================================================================
    const screenContainer = document.getElementById("screen_container");
    let pointerButtons = [false, false, false]; // [left, middle, right]
    let lastClientX = null;
    let lastClientY = null;

    function sendGuestPointer(clientX, clientY, buttonsChanged) {
      if (!emulator || !emulator.bus) return;
      const rect = screenContainer.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;

      let dx = 0;
      let dy = 0;
      if (lastClientX !== null && lastClientY !== null) {
        dx = clientX - lastClientX;
        dy = clientY - lastClientY;
      }
      lastClientX = clientX;
      lastClientY = clientY;

      // VBMOUSE needs a tiny PS/2 movement packet (IRQ 12) to wake up and read the 0x5658 absolute queue!
      const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
      const y = Math.max(0, Math.min(rect.height, clientY - rect.top));
      emulator.bus.send("mouse-absolute", [x, y, rect.width, rect.height]);
      if (dx !== 0 || dy !== 0) {
        emulator.bus.send("mouse-delta", [dx, -dy]);
      }
      if (buttonsChanged) {
        emulator.bus.send("mouse-click", [pointerButtons[0], pointerButtons[1], pointerButtons[2]]);
      }
    }

    function releaseAllPointerButtons() {
      if (pointerButtons[0] || pointerButtons[1] || pointerButtons[2]) {
        pointerButtons = [false, false, false];
        if (emulator && emulator.bus) {
          emulator.bus.send("mouse-click", [false, false, false]);
        }
      }
    }

    screenContainer.addEventListener("mousemove", (e) => {
      // Sync button state from e.buttons bitmask in case mouseup occurred outside window
      const left = (e.buttons & 1) !== 0;
      const right = (e.buttons & 2) !== 0;
      const middle = (e.buttons & 4) !== 0;
      const changed =
        left !== pointerButtons[0] ||
        middle !== pointerButtons[1] ||
        right !== pointerButtons[2];
      pointerButtons = [left, middle, right];
      sendGuestPointer(e.clientX, e.clientY, changed);
    });

    screenContainer.addEventListener("mousedown", (e) => {
      if (e.button === 0) pointerButtons[0] = true;
      else if (e.button === 1) pointerButtons[1] = true;
      else if (e.button === 2) pointerButtons[2] = true;
      sendGuestPointer(e.clientX, e.clientY, true);
      window.focus();
      e.preventDefault();
    });

    window.addEventListener("mouseup", (e) => {
      const idx = e.button === 0 ? 0 : e.button === 1 ? 1 : e.button === 2 ? 2 : -1;
      if (idx !== -1 && pointerButtons[idx]) {
        pointerButtons[idx] = false;
        sendGuestPointer(e.clientX, e.clientY, true);
      }
    });

    window.addEventListener("blur", releaseAllPointerButtons);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) releaseAllPointerButtons();
    });

    screenContainer.addEventListener("contextmenu", (e) => e.preventDefault());

    screenContainer.addEventListener(
      "wheel",
      (e) => {
        if (!emulator || !emulator.bus) return;
        const delta = e.deltaY < 0 ? 1 : e.deltaY > 0 ? -1 : 0;
        if (delta !== 0) {
          emulator.bus.send("mouse-wheel", [delta, 0]);
        }
        e.preventDefault();
      },
      { passive: false }
    );

    // Mobile Touch Support: Tap to click, 1-finger vertical drag to scroll page
    let touchState = null;
    screenContainer.addEventListener(
      "touchstart",
      (e) => {
        if (e.touches.length === 1) {
          const t = e.touches[0];
          touchState = {
            startX: t.clientX,
            startY: t.clientY,
            lastY: t.clientY,
            moved: false,
          };
          sendGuestPointer(t.clientX, t.clientY, false);
        }
        e.preventDefault();
      },
      { passive: false }
    );

    screenContainer.addEventListener(
      "touchmove",
      (e) => {
        if (e.touches.length === 1 && touchState) {
          const t = e.touches[0];
          const dx = t.clientX - touchState.startX;
          const dy = t.clientY - touchState.startY;
          if (Math.hypot(dx, dy) > 8) {
            touchState.moved = true;
          }
          sendGuestPointer(t.clientX, t.clientY, false);
          // Scroll Netscape with Up/Down arrow scancodes when swiping vertically
          const stepY = t.clientY - touchState.lastY;
          if (Math.abs(stepY) >= 24) {
            touchState.lastY = t.clientY;
            if (stepY < 0) {
              // Swipe up -> scroll down (Down Arrow E0 50)
              emulator.keyboard_send_scancodes([0xe0, 0x50, 0xe0, 0xd0]);
            } else {
              // Swipe down -> scroll up (Up Arrow E0 48)
              emulator.keyboard_send_scancodes([0xe0, 0x48, 0xe0, 0xc8]);
            }
          }
        }
        e.preventDefault();
      },
      { passive: false }
    );

    screenContainer.addEventListener(
      "touchend",
      (e) => {
        if (touchState && !touchState.moved) {
          pointerButtons[0] = true;
          sendGuestPointer(touchState.startX, touchState.startY, true);
          setTimeout(() => {
            pointerButtons[0] = false;
            sendGuestPointer(touchState.startX, touchState.startY, true);
          }, 45);
        }
        touchState = null;
        e.preventDefault();
      },
      { passive: false }
    );

    // Overall progress across every downloaded file.
    const downloads = new Map();
    emulator.add_listener("download-progress", (e) => {
      if (e && e.total > 0) {
        downloads.set(e.file_index, e);
        let loaded = 0, total = 0;
        for (const d of downloads.values()) {
          loaded += d.loaded;
          total += d.total;
        }
        powerProgress.style.width = `${Math.min(100, (loaded / total) * 100)}%`;
      }
    });

    // =========================================================================
    // 3. Automatic Native Resolution Sync via COM1 -> RESCHG.EXE
    // =========================================================================
    // Among modes sharing the best aspect ratio, the one nearest the viewport's size, up to the
    // snapshot's mode.
    const [snapshotW, snapshotH] = guestDisplay.snapshotMode;
    const MAX_GUEST_PIXELS = snapshotW * snapshotH;

    const monitorFrame = document.getElementById("monitor-frame");
    let vmLoaded = false;
    let reschgReady = false;
    let requestedMode = null;

    // The frame always takes the guest screen's own aspect ratio, so pixels stay square.
    emulator.add_listener("screen-set-size", ([w, h, bpp]) => {
      if (bpp === 0) return; // text mode: columns and rows
      monitorFrame.style.width = `min(100vw, calc(100vh * ${w} / ${h}))`;
      monitorFrame.style.height = `min(100vh, calc(100vw * ${h} / ${w}))`;
    });

    function pickGuestMode(modes, vw, vh) {
      const misfit = ([w, h]) => Math.abs(Math.log(w / h / (vw / vh)));
      const best = Math.min(...modes.map(misfit));
      const fitting = modes.filter((m) => misfit(m) - best < 1e-9);
      const target = Math.min(vw * vh, MAX_GUEST_PIXELS);
      const sizeMisfit = ([w, h]) => Math.abs(Math.log((w * h) / target));
      return fitting.reduce((a, b) => (sizeMisfit(b) < sizeMisfit(a) ? b : a));
    }

    function syncGuestResolution() {
      if (!vmLoaded || !reschgReady) return;
      const [w, h] = pickGuestMode(guestDisplay.modes, window.innerWidth, window.innerHeight);
      if (requestedMode && requestedMode[0] === w && requestedMode[1] === h) return;
      requestedMode = [w, h];
      emulator.serial0_send(`RES ${w} ${h}\n`);
    }

    // RESCHG.EXE announces itself on COM1 once it runs (it resets the UART, dropping anything
    // sent earlier) and answers each switch with RESCHG_OK or RESCHG_ERR.
    let serialLine = "";
    emulator.add_listener("serial0-output-byte", (byte) => {
      const c = String.fromCharCode(byte);
      if (c !== "\n") {
        serialLine += c;
        return;
      }
      const line = serialLine;
      serialLine = "";
      if (line === "RESCHG_READY") {
        reschgReady = true;
        requestedMode = null;
        syncGuestResolution();
      } else if (line === "RESCHG_ERR") {
        console.error(`RESCHG.EXE could not switch the guest to ${requestedMode.join("x")}`);
      }
    });

    function scheduleResolutionSync() {
      clearTimeout(scheduleResolutionSync.timer);
      scheduleResolutionSync.timer = setTimeout(syncGuestResolution, 180);
    }
    window.addEventListener("resize", scheduleResolutionSync);

    emulator.add_listener("emulator-loaded", () => {
      vmLoaded = true;
      powerProgress.style.width = "100%";
      syncGuestResolution();
      powerButton.disabled = false;
    });

    // The press itself must run the emulator so the user activation unlocks audio.
    powerButton.addEventListener("click", (e) => {
      e.stopPropagation();
      powerScreen.hidden = true;
      emulator.run();
    });
